<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Grammar and Tone Adjuster Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 16px;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #4285f4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #3367d6;
    }
    .success-message {
      color: green;
      margin-top: 8px;
      display: none;
    }
    .instructions {
      margin-top: 16px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h2>Grammar and Tone Adjuster</h2>
  <div class="instructions">
    <p><b>How to use:</b></p>
    <ol>
      <li>Select any text on a webpage</li>
      <li>Use the popup menu to adjust tone or fix grammar</li>
      <li>Click "Apply Changes" to replace the text</li>
    </ol>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
